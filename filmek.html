<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="filmek.css">
</head>
<body>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>Title</th>
                <th>Year</th>
                <th>Genre</th>
                <th>Rating</th>
            </tr>
        </thead>
        <tbody id="tbody">
        </tbody>
    </table>
    <form action="" id="myForm">
        <label for="ntitle">Title:</label><br>
        <input type="text" name="Title" id="new-title">
        <br>
        <label for="nyear">Year:</label><br>
        <input type="number" name="Year" id="new-year">
        <br>
        <label for="ngenre">Genre:</label><br>
        <input type="text" name="Genre" id="new-genre">
        <br>
        <label for="nrating">Rating:</label><br>
        <input type="number" name="Rating" id="new-rating">
        <br>
        <br>
        <input type="submit" value="Add">
    </form>
    
</body>
<script src="filmek.js"></script>
</html>
